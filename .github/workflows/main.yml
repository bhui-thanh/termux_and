name: Build rclone Termux

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TERMUX_PACKAGES_REF: "2adb8535c5074aa54cb9fe7f0c973bdffb21b2d7"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout custom patch
        uses: actions/checkout@v4

      - name: Checkout Termux packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_REF }}
          path: termux-packages
          fetch-depth: 1

      - name: Verify Termux packages revision
        working-directory: termux-packages
        run: |
          echo "Expected:"
          echo "$TERMUX_PACKAGES_REF"

          echo
          echo "Actual:"
          git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "$TERMUX_PACKAGES_REF"

      - name: Show pinned recipes
        working-directory: termux-packages
        run: |
          echo "===== GOLANG ====="
          sed -n '1,220p' packages/golang/build.sh

          echo
          echo "===== RCLONE ====="
          sed -n '1,160p' packages/rclone/build.sh

      - name: Install custom rclone patch
        run: |
          cp file.patch \
            termux-packages/packages/rclone/termux-rclone.patch

      - name: Verify custom patch
        working-directory: termux-packages
        run: |
          echo "===== CUSTOM PATCH ====="
          cat packages/rclone/termux-rclone.patch

          echo
          echo "Patch file:"
          test -s packages/rclone/termux-rclone.patch

      - name: Build rclone
        working-directory: termux-packages
        run: |
          ./build-package.sh \
            -a aarch64 \
            -f \
            rclone

      - name: Show build output
        working-directory: termux-packages
        run: |
          echo "===== OUTPUT ====="
          find output -type f -print

          echo
          echo "===== SHA256 ====="
          sha256sum output/*.deb

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rclone-1.72.1-termux-aarch64
          path: |
            termux-packages/output/*.deb
