name: Build rclone 1.72.1 Termux

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TERMUX_PACKAGES_REF: "2adb8535c5074aa54cb9fe7f0c973bdffb21b2d7"

jobs:
  build:
    name: rclone 1.72.1 / aarch64
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # Checkout exact Termux packages revision
      # ==========================================================
      - name: Checkout Termux packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_REF }}
          path: termux-packages
          fetch-depth: 1

      # ==========================================================
      # Verify exact commit
      # ==========================================================
      - name: Verify Termux revision
        working-directory: termux-packages
        run: |
          set -eux

          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected:"
          echo "$TERMUX_PACKAGES_REF"

          echo
          echo "Actual:"
          echo "$ACTUAL"

          test "$ACTUAL" = "$TERMUX_PACKAGES_REF"

      # ==========================================================
      # Install host dependencies
      #
      # We don't run setup-ubuntu.sh.
      # GitHub ubuntu-24.04 already provides most basic tools.
      # ==========================================================
      - name: Install host dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            bison \
            build-essential \
            clang \
            cmake \
            curl \
            file \
            flex \
            gawk \
            git \
            libtool \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      # ==========================================================
      # Configure Java 17
      # ==========================================================
      - name: Configure Java
        run: |
          set -eux

          JAVAC="$(command -v javac)"

          test -n "$JAVAC"

          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$JAVAC")")")"

          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

          echo "Java:"
          java -version

          echo
          echo "Javac:"
          javac -version

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/javac"

      # ==========================================================
      # Setup Android SDK + NDK
      #
      # Uses the exact setup script from the pinned Termux
      # packages revision.
      # ==========================================================
      - name: Setup Android SDK and NDK
        working-directory: termux-packages
        run: |
          set -eux

          ./scripts/setup-android-sdk.sh

      # ==========================================================
      # Verify NDK
      # ==========================================================
      - name: Verify Android NDK
        run: |
          set -eux

          NDK="$HOME/lib/android-ndk-r29"

          test -d "$NDK"
          test -f "$NDK/source.properties"

          echo "NDK:"
          ls -ld "$NDK"

          echo
          echo "NDK revision:"
          grep 'Pkg.Revision' \
            "$NDK/source.properties"

      # ==========================================================
      # Prepare filesystem expected by Termux build system
      # ==========================================================
      - name: Prepare Termux filesystem
        run: |
          set -eux

          # Termux prefix
          sudo mkdir -p \
            /data/data/com.termux/files/usr

          sudo chown -R \
            "$(id -u):$(id -g)" \
            /data/data/com.termux

          # Architecture file required by this Termux revision
          sudo touch /data/TERMUX_ARCH

          sudo chown \
            "$(id -u):$(id -g)" \
            /data/TERMUX_ARCH

          printf '%s\n' aarch64 > /data/TERMUX_ARCH

          echo "TERMUX_ARCH:"
          cat /data/TERMUX_ARCH

          echo
          echo "TERMUX PREFIX:"
          ls -ld \
            /data/data/com.termux/files/usr

      # ==========================================================
      # Verify rclone recipe
      #
      # This is the ORIGINAL recipe from the pinned commit.
      # NO custom patch is injected.
      # ==========================================================
      - name: Verify rclone recipe
        working-directory: termux-packages
        run: |
          set -eux

          echo "===== rclone build.sh ====="

          cat packages/rclone/build.sh

          echo
          echo "===== VERSION ====="

          grep -F \
            'TERMUX_PKG_VERSION="1.72.1"' \
            packages/rclone/build.sh

          echo
          echo "===== SHA256 ====="

          grep -F \
            '227b84024e7e72056f716ee520c4db8b88ec5f80dc83f0899b431b2ce2b25f9b' \
            packages/rclone/build.sh

      # ==========================================================
      # Verify Go recipe
      #
      # The pinned recipe is Go 1.25.4 and applies:
      #
      #   fix-hardcoded-etc-resolv-conf.sh
      #   remove-pidfd.sh
      # ==========================================================
      - name: Verify Go recipe
        working-directory: termux-packages
        run: |
          set -eux

          echo "===== golang build.sh ====="

          cat packages/golang/build.sh

          echo
          echo "===== VERSION ====="

          grep -F \
            'TERMUX_PKG_VERSION="3:1.25.4"' \
            packages/golang/build.sh

          echo
          echo "===== SHA256 ====="

          grep -F \
            '160043b7f17b6d60b50369436917fda8d5034640ba39ae2431c6b95a889cc98c' \
            packages/golang/build.sh

          echo
          echo "===== Go Termux patches ====="

          grep -F \
            'fix-hardcoded-etc-resolv-conf.sh' \
            packages/golang/build.sh

          grep -F \
            'remove-pidfd.sh' \
            packages/golang/build.sh

      # ==========================================================
      # Show existing rclone patches
      #
      # These are the patches already provided by Termux.
      # ==========================================================
      - name: Show rclone patches
        working-directory: termux-packages
        run: |
          set -eux

          echo "===== RCLONE PATCHES ====="

          find packages/rclone \
            -maxdepth 1 \
            -type f \
            -name '*.patch' \
            -print \
            | sort

      # ==========================================================
      # Build rclone
      #
      # IMPORTANT:
      #
      # -F forces dependency builds.
      #
      # We do NOT use:
      #
      #   -I
      #
      # because we want Go to be built from source using the
      # pinned Termux golang recipe.
      #
      # Dependency chain:
      #
      #   rclone
      #      |
      #      +-- golang 1.25.4
      #              |
      #              +-- bootstrap Go
      #
      # Go receives Termux's:
      #
      #   fix-hardcoded-etc-resolv-conf.sh
      #   remove-pidfd.sh
      #
      # before it is used to build rclone.
      # ==========================================================
      - name: Build rclone
        working-directory: termux-packages
        run: |
          set -eux

          ./build-package.sh \
            -a aarch64 \
            -F \
            rclone

      # ==========================================================
      # Inspect output
      # ==========================================================
      - name: Inspect build output
        working-directory: termux-packages
        run: |
          set -eux

          echo "===== OUTPUT ====="

          find output \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "===== RCLONE PACKAGE ====="

          ls -lh \
            output/rclone_*.deb

          echo
          echo "===== SHA256 ====="

          sha256sum \
            output/rclone_*.deb

      # ==========================================================
      # Inspect .deb metadata
      # ==========================================================
      - name: Inspect rclone package
        working-directory: termux-packages
        run: |
          set -eux

          DEB="$(
            find output \
              -maxdepth 1 \
              -name 'rclone_*.deb' \
              -print \
              -quit
          )"

          test -n "$DEB"
          test -f "$DEB"

          echo "===== DEB INFO ====="

          dpkg-deb \
            --info \
            "$DEB"

          echo
          echo "===== DEB CONTENTS ====="

          dpkg-deb \
            --contents \
            "$DEB"

      # ==========================================================
      # Extract and inspect binary
      # ==========================================================
      - name: Inspect rclone binary
        working-directory: termux-packages
        run: |
          set -eux

          DEB="$(
            find output \
              -maxdepth 1 \
              -name 'rclone_*.deb' \
              -print \
              -quit
          )"

          rm -rf /tmp/rclone-package

          mkdir -p /tmp/rclone-package

          dpkg-deb \
            -x \
            "$DEB" \
            /tmp/rclone-package

          RCLONE="$(
            find /tmp/rclone-package \
              -type f \
              -name rclone \
              -print \
              -quit
          )"

          test -n "$RCLONE"
          test -f "$RCLONE"

          echo "===== BINARY ====="
          echo "$RCLONE"

          echo
          echo "===== FILE ====="

          file "$RCLONE"

          echo
          echo "===== SIZE ====="

          ls -lh "$RCLONE"

          echo
          echo "===== RESOLV.CONF STRINGS ====="

          strings "$RCLONE" \
            | grep -E \
              '/etc/resolv.conf|resolv.conf' \
            || true

          echo
          echo "===== TERMUX PATH STRINGS ====="

          strings "$RCLONE" \
            | grep -F \
              '/data/data/com.termux/files/usr' \
            | head -20 \
            || true

      # ==========================================================
      # Generate checksum
      # ==========================================================
      - name: Generate SHA256SUMS
        working-directory: termux-packages
        run: |
          set -eux

          sha256sum \
            output/rclone_*.deb \
            > rclone-SHA256SUMS

          cat rclone-SHA256SUMS

      # ==========================================================
      # Upload final artifact
      # ==========================================================
      - name: Upload rclone package
        uses: actions/upload-artifact@v4
        with:
          name: rclone-1.72.1-termux-aarch64
          path: |
            termux-packages/output/rclone_*.deb
            termux-packages/rclone-SHA256SUMS
