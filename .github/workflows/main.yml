name: Build rclone 1.72.1 Termux

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TERMUX_PACKAGES_REF: "2adb8535c5074aa54cb9fe7f0c973bdffb21b2d7"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout custom repository
        uses: actions/checkout@v4

      - name: Checkout pinned Termux packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_REF }}
          path: termux-packages
          fetch-depth: 1

      - name: Verify Termux revision
        working-directory: termux-packages
        run: |
          set -eux

          test "$(git rev-parse HEAD)" = "$TERMUX_PACKAGES_REF"

      - name: Install host dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            bison \
            build-essential \
            clang \
            cmake \
            curl \
            file \
            flex \
            gawk \
            git \
            libtool \
            make \
            patch \
            pkg-config \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      - name: Setup Android SDK and NDK
        working-directory: termux-packages
        run: |
          set -eux

          ./scripts/setup-android-sdk.sh

      - name: Verify NDK
        run: |
          set -eux

          test -d "$HOME/lib/android-ndk-r29"
          test -f "$HOME/lib/android-ndk-r29/source.properties"

          grep 'Pkg.Revision' \
            "$HOME/lib/android-ndk-r29/source.properties"

      - name: Prepare Termux filesystem
        run: |
          set -eux

          sudo mkdir -p \
            /data/data/com.termux/files/usr

          sudo chown -R \
            "$(id -u):$(id -g)" \
            /data/data/com.termux

          sudo touch /data/TERMUX_ARCH

          sudo chown \
            "$(id -u):$(id -g)" \
            /data/TERMUX_ARCH

          printf '%s\n' aarch64 > /data/TERMUX_ARCH

          cat /data/TERMUX_ARCH

      - name: Install custom rclone patch
        run: |
          set -eux

          test -f file.patch

          cp \
            file.patch \
            termux-packages/packages/rclone/termux-rclone.patch

      - name: Verify custom patch
        run: |
          set -eux

          echo "===== CUSTOM PATCH ====="
          cat termux-packages/packages/rclone/termux-rclone.patch

          echo
          echo "===== EXISTING TERMUX PATCHES ====="
          ls -1 termux-packages/packages/rclone/*.patch

      - name: Verify rclone recipe
        working-directory: termux-packages
        run: |
          set -eux

          grep \
            'TERMUX_PKG_VERSION="1.72.1"' \
            packages/rclone/build.sh

          grep \
            '227b84024e7e72056f716ee520c4db8b88ec5f80dc83f0899b431b2ce2b25f9b' \
            packages/rclone/build.sh

      - name: Verify Go recipe
        working-directory: termux-packages
        run: |
          set -eux

          grep \
            'TERMUX_PKG_VERSION="3:1.25.4"' \
            packages/golang/build.sh

          grep \
            '160043b7f17b6d60b50369436917fda8d5034640ba39ae2431c6b95a889cc98c' \
            packages/golang/build.sh

          grep \
            'fix-hardcoded-etc-resolv-conf.sh' \
            packages/golang/build.sh

          grep \
            'remove-pidfd.sh' \
            packages/golang/build.sh

      - name: Build rclone
        working-directory: termux-packages
        run: |
          set -eux

          ./build-package.sh \
            -a aarch64 \
            -F \
            rclone

      - name: Inspect output
        working-directory: termux-packages
        run: |
          set -eux

          echo "===== OUTPUT ====="

          find output \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "===== RCLONE ====="

          ls -lh output/rclone_*.deb

          echo
          echo "===== SHA256 ====="

          sha256sum output/rclone_*.deb

      - name: Inspect package
        working-directory: termux-packages
        run: |
          set -eux

          DEB="$(find output \
            -maxdepth 1 \
            -name 'rclone_*.deb' \
            -print -quit)"

          test -f "$DEB"

          dpkg-deb --info "$DEB"

          echo
          dpkg-deb --contents "$DEB"

      - name: Upload rclone package
        uses: actions/upload-artifact@v4
        with:
          name: rclone-1.72.1-termux-aarch64
          path: |
            termux-packages/output/rclone_*.deb
