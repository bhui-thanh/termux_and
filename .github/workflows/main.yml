name: Build rclone 1.72.1 Termux

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TERMUX_PACKAGES_REF: "2adb8535c5074aa54cb9fe7f0c973bdffb21b2d7"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout custom files
        uses: actions/checkout@v4

      - name: Checkout pinned Termux packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_REF }}
          path: termux-packages
          fetch-depth: 1

      - name: Verify pinned revision
        working-directory: termux-packages
        run: |
          set -eux

          test "$(git rev-parse HEAD)" = "$TERMUX_PACKAGES_REF"

          echo "Termux packages:"
          git rev-parse HEAD

      # Install all host dependencies expected by termux-packages.
      - name: Setup Ubuntu build environment
        working-directory: termux-packages
        run: |
          sudo ./scripts/setup-ubuntu.sh

      # This is the important missing step from the previous workflow.
      # It installs Android SDK + NDK using the exact versions and
      # checksums defined by this pinned Termux commit.
      - name: Setup Android SDK and NDK
        working-directory: termux-packages
        run: |
          ./scripts/setup-android-sdk.sh

      - name: Verify Android NDK
        run: |
          set -eux

          test -d "$HOME/lib/android-ndk-r29"
          test -f "$HOME/lib/android-ndk-r29/source.properties"

          echo "NDK:"
          grep 'Pkg.Revision' \
            "$HOME/lib/android-ndk-r29/source.properties"

          echo
          echo "NDK path:"
          ls -ld "$HOME/lib/android-ndk-r29"

      - name: Install custom rclone patch
        run: |
          set -eux

          test -f file.patch

          cp file.patch \
            termux-packages/packages/rclone/termux-rclone.patch

      - name: Verify rclone recipe
        working-directory: termux-packages
        run: |
          set -eux

          echo "===== rclone build.sh ====="
          sed -n '1,220p' packages/rclone/build.sh

          echo
          echo "===== rclone patch ====="
          cat packages/rclone/termux-rclone.patch

          echo
          echo "===== golang build.sh ====="
          sed -n '1,220p' packages/golang/build.sh

      # No -I here.
      #
      # We intentionally want the dependency chain to build locally,
      # rather than downloading the prebuilt Go package from the
      # Termux repository.
      #
      # This causes the Termux build system to build golang first,
      # then rclone.
      - name: Build Go 1.25.4 and rclone 1.72.1
        working-directory: termux-packages
        run: |
          set -eux

          ./build-package.sh \
            -a aarch64 \
            -F \
            golang \
            rclone

      - name: Inspect generated packages
        working-directory: termux-packages
        run: |
          set -eux

          echo "===== OUTPUT ====="
          find output \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "===== SHA256 ====="
          sha256sum output/*.deb

      - name: Verify rclone package exists
        working-directory: termux-packages
        run: |
          set -eux

          ls output/rclone_*.deb

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: rclone-1.72.1-termux-aarch64
          path: |
            termux-packages/output/rclone_*.deb
            termux-packages/output/golang_*.deb
